name: Python preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Prepare preview distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.identity.outputs.revision }}
      version: ${{ steps.identity.outputs.version }}
      manifest-sha256: ${{ steps.manifest.outputs.manifest-sha256 }}
    steps:
      - name: Check out candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install stable build tools
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - name: Qualify source before native execution
        run: |
          uv sync --frozen --dev
          uv run make check test workflow-lint
      - name: Record candidate identity
        id: identity
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          echo "revision=$EXPECTED_REVISION" >> "$GITHUB_OUTPUT"
          uv run --frozen python -c 'import tomllib; print("version=" + tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])' >> "$GITHUB_OUTPUT"
      - name: Build and seal one preview wheel and sdist
        id: manifest
        env:
          SOURCE_REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          uv build --no-sources --out-dir preview-dist
          uv run --frozen python scripts/qualify_lifecycle.py manifest \
            --distributions preview-dist --revision "$SOURCE_REVISION" \
            --github-output "$GITHUB_OUTPUT"
      - name: Retain preview distributions and manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-preview-distributions
          path: preview-dist/*
          if-no-files-found: error
          retention-days: 30

  native:
    name: Python 3.15.0rc3 preview (libiperf ${{ matrix.iperf }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        iperf: ["3.19.1", "3.21"]
    steps:
      - name: Check out the sealed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - name: Download the same preview distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-preview-distributions
          path: preview-dist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the native base
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: iperf3-lib-preview-base:local
          build-args: |
            PYTHON_BASE=python:3.14-slim
            IPERF3_VERSION=${{ matrix.iperf }}
          cache-from: type=gha,scope=preview-base-iperf${{ matrix.iperf }}
          cache-to: type=gha,mode=max,scope=preview-base-iperf${{ matrix.iperf }}
      - name: Install the exact candidate interpreter in a separate environment
        run: |
          docker pull ghcr.io/astral-sh/uv:0.12.23@sha256:dd2385ac82b9aff6489344ec2b22916db986eb135454d030bce3038c7598a689
          docker build --builder default --load -f Dockerfile.preview \
            --build-arg NATIVE_IMAGE=iperf3-lib-preview-base:local \
            -t iperf3-lib-preview:local .
      - name: Record and assert actual preview runtime
        env:
          SOURCE_REVISION: ${{ needs.build.outputs.revision }}
          IPERF3_VERSION: ${{ matrix.iperf }}
        run: |
          mkdir -p preview-evidence
          docker image inspect iperf3-lib-preview:local > preview-evidence/image.json
          docker image inspect ghcr.io/astral-sh/uv:0.12.23@sha256:dd2385ac82b9aff6489344ec2b22916db986eb135454d030bce3038c7598a689 > preview-evidence/uv-image.json
          docker run --rm -v "${{ github.workspace }}/preview-evidence:/evidence" \
            iperf3-lib-preview:local \
            /opt/preview-venv/bin/python -I /app/scripts/python_preview.py \
            --revision "$SOURCE_REVISION" --native "$IPERF3_VERSION" \
            --output /evidence/runtime.json
      - name: Run RC3 non-native checks before native integration
        run: |
          docker run --rm iperf3-lib-preview:local \
            /opt/preview-venv/bin/python -m pytest -m 'not integration' -vv
      - name: Run the RC3 native integration suite
        run: |
          docker run --rm iperf3-lib-preview:local \
            /opt/preview-venv/bin/python -m pytest -m integration -vv
      - name: Qualify installed preview wheel and sdist lifecycle
        env:
          SOURCE_REVISION: ${{ needs.build.outputs.revision }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
          IPERF3_VERSION: ${{ matrix.iperf }}
        run: |
          mkdir -p preview-evidence/lifecycle
          docker run --rm --cap-add NET_ADMIN -e IPERF3_ADAPTIVE_IMPAIRMENT=1 \
            -v "${{ github.workspace }}/preview-dist:/preview-dist:ro" \
            -v "${{ github.workspace }}/preview-evidence/lifecycle:/evidence" \
            iperf3-lib-preview:local \
            /opt/preview-venv/bin/python -I /app/scripts/qualify_lifecycle.py qualify \
            --source /app --distributions /preview-dist \
            --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256" \
            --python 3.15 --native "$IPERF3_VERSION" --output /evidence
      - name: Smoke both installed preview formats with explicit RC3 selection
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          SOURCE_REVISION: ${{ needs.build.outputs.revision }}
          IPERF3_VERSION: ${{ matrix.iperf }}
        run: |
          mkdir -p preview-evidence/smoke
          docker run --rm --entrypoint bash \
            -v "${{ github.workspace }}/preview-dist:/preview-dist:ro" \
            -v "${{ github.workspace }}/preview-evidence/smoke:/evidence" \
            -e EXPECTED_VERSION -e SOURCE_REVISION -e IPERF3_VERSION \
            iperf3-lib-preview:local -euc '
              for kind in wheel sdist; do
                venv="/tmp/installed-$kind"
                uv venv --python /opt/preview-venv/bin/python "$venv"
                "$venv/bin/python" -I -c "import sys; assert sys.version_info == (3, 15, 0, \"candidate\", 3)"
                if [ "$kind" = wheel ]; then
                  set -- /preview-dist/*.whl
                else
                  set -- /preview-dist/*.tar.gz
                fi
                artifact="$1"
                uv pip install --python "$venv/bin/python" "$artifact"
                uv pip check --python "$venv/bin/python"
                cd /tmp
                timeout 120 "$venv/bin/python" -I /app/scripts/smoke_release.py \
                  --expected-version "$EXPECTED_VERSION" \
                  --expected-native-version "$IPERF3_VERSION" \
                  --source-revision "$SOURCE_REVISION" --distribution "$artifact" \
                  --output "/evidence/$kind.json"
              done
            '
      - name: Retain preview runtime, installed receipts and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-preview-rc3-iperf${{ matrix.iperf }}
          path: preview-evidence/**
          if-no-files-found: error
          retention-days: 30

  preview:
    name: Python preview qualification
    needs: [build, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the build and both native endpoints
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
