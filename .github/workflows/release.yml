name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Qualify without publishing, or explicitly publish to TestPyPI"
        type: choice
        options: [qualify, testpypi]
        default: qualify
        required: true
      version:
        description: "Optional assertion against project.version (for example, 0.3.0)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Qualify source and retain distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      prerelease: ${{ steps.release-version.outputs.prerelease }}
      revision: ${{ steps.release-version.outputs.revision }}
      mode: ${{ steps.release-version.outputs.mode }}
      manifest-sha256: ${{ steps.artifacts.outputs.manifest-sha256 }}
    steps:
      - name: Check out exact event revision and branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Validate release identity and publication ancestry
        id: release-version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'pypi' || inputs.target || 'qualify' }}
          EXPECTED_REVISION: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          uv run --no-project --python 3.12 python scripts/validate_release.py \
            --tag "$RELEASE_TAG" --requested-version "$REQUESTED_VERSION" \
            --mode "$RELEASE_MODE" --expected-revision "$EXPECTED_REVISION" \
            --default-branch "$DEFAULT_BRANCH" --github-output "$GITHUB_OUTPUT"
      - name: Synchronize qualification tools
        run: uv sync --frozen --dev --group release
      - name: Qualify source, documentation, and workflow policy
        run: uv run make check test workflow-lint
      - name: Build the only wheel and source distribution
        run: uv build --no-sources
      - name: Validate distribution metadata and contents
        run: |
          uv run --frozen --no-dev --group release twine check dist/*
          uv run --frozen --no-dev --group release check-wheel-contents dist/*.whl
      - name: Inspect descriptions and seal distribution hashes
        id: artifacts
        env:
          EXPECTED_VERSION: ${{ steps.release-version.outputs.version }}
          EXPECTED_REVISION: ${{ steps.release-version.outputs.revision }}
        run: |
          uv run --frozen --dev python -m scripts.release_artifacts inspect \
            --version "$EXPECTED_VERSION" --revision "$EXPECTED_REVISION" \
            --check-public-links --github-output "$GITHUB_OUTPUT"
      - name: Upload retained distributions and identity manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-bundle
          path: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/manifest.json
          if-no-files-found: error
          retention-days: 30

  native:
    name: native + installed artifacts (Python ${{ matrix.python }}, libiperf ${{ matrix.iperf }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        iperf: ["3.19.1", "3.21"]
    steps:
      - name: Check out the qualified source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.revision }}
          persist-credentials: false
      - name: Download retained release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Verify retained distribution hashes
        env:
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = Path("release-evidence/manifest.json")
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != os.environ["MANIFEST_SHA256"]:
              raise SystemExit("Release manifest hash mismatch")
          data = json.loads(manifest.read_text())
          version = os.environ["EXPECTED_VERSION"]
          expected = {f"iperf3_lib-{version}-py3-none-any.whl", f"iperf3_lib-{version}.tar.gz"}
          if (data["schema_version"] != 1 or data["version"] != version
                  or data["revision"] != os.environ["EXPECTED_REVISION"]
                  or set(data["files"]) != expected
                  or {p.name for p in Path("dist").iterdir()} != expected):
              raise SystemExit("Release bundle identity mismatch")
          for name in sorted(expected):
              path = Path("dist") / name
              actual = {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                        "size": path.stat().st_size}
              if actual != data["files"][name]:
                  raise SystemExit(f"Release artifact changed: {name}")
          PY
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build exact-source compatibility image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: iperf3-lib-release:local
          build-args: |
            PYTHON_BASE=python:${{ matrix.python }}-slim
            IPERF3_VERSION=${{ matrix.iperf }}
          cache-from: type=gha,scope=release-py${{ matrix.python }}-iperf${{ matrix.iperf }}
          cache-to: type=gha,mode=max,scope=release-py${{ matrix.python }}-iperf${{ matrix.iperf }}
      - name: Run full native suite and lifecycle coverage
        run: >-
          docker run --rm iperf3-lib-release:local
          pytest -vv --cov=iperf3_lib --cov-report=term-missing
      - name: Qualify installed wheel and sdist outside the source checkout
        env:
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
          IPERF3_VERSION: ${{ matrix.iperf }}
        run: |
          mkdir -p native-evidence
          docker run --rm --entrypoint bash \
            -v "${{ github.workspace }}/dist:/release-dist:ro" \
            -v "${{ github.workspace }}/native-evidence:/evidence" \
            -e EXPECTED_VERSION -e EXPECTED_REVISION -e IPERF3_VERSION iperf3-lib-release:local -euc '
              for kind in wheel sdist; do
                venv="/tmp/installed-$kind"
                uv venv "$venv"
                if [ "$kind" = wheel ]; then
                  set -- /release-dist/*.whl
                else
                  set -- /release-dist/*.tar.gz
                fi
                artifact="$1"
                uv pip install --python "$venv/bin/python" "$artifact"
                uv pip check --python "$venv/bin/python"
                cd /tmp
                timeout 120 "$venv/bin/python" -I /app/scripts/smoke_release.py \
                  --expected-version "$EXPECTED_VERSION" \
                  --expected-native-version "$IPERF3_VERSION" \
                  --source-revision "$EXPECTED_REVISION" --distribution "$artifact" \
                  --output "/evidence/$kind.json"
              done
            '
      - name: Retain installed-native evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-evidence-py${{ matrix.python }}-iperf${{ matrix.iperf }}
          path: native-evidence/*.json
          if-no-files-found: warn
          retention-days: 30

  qualified:
    name: Release qualification
    needs: [build, native]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require source, artifact, and every native qualification job
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          REVISION: ${{ needs.build.outputs.revision }}
        run: |
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
          echo "Qualified revision: $REVISION" >> "$GITHUB_STEP_SUMMARY"

  publish-testpypi:
    name: Publish retained distributions to TestPyPI
    needs: [build, qualified]
    if: ${{ needs.build.outputs.mode == 'testpypi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/iperf3-lib
    permissions:
      id-token: write
    steps:
      - name: Download retained release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Verify retained distribution hashes
        env:
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = Path("release-evidence/manifest.json")
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != os.environ["MANIFEST_SHA256"]:
              raise SystemExit("Release manifest hash mismatch")
          data = json.loads(manifest.read_text())
          version = os.environ["EXPECTED_VERSION"]
          expected = {f"iperf3_lib-{version}-py3-none-any.whl", f"iperf3_lib-{version}.tar.gz"}
          if (data["schema_version"] != 1 or data["version"] != version
                  or data["revision"] != os.environ["EXPECTED_REVISION"]
                  or set(data["files"]) != expected
                  or {p.name for p in Path("dist").iterdir()} != expected):
              raise SystemExit("Release bundle identity mismatch")
          for name in sorted(expected):
              path = Path("dist") / name
              actual = {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                        "size": path.stat().st_size}
              if actual != data["files"][name]:
                  raise SystemExit(f"Release artifact changed: {name}")
          PY
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish retained distributions to PyPI
    needs: [build, qualified]
    if: ${{ needs.build.outputs.mode == 'pypi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/iperf3-lib
    permissions:
      id-token: write
    steps:
      - name: Download retained release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Verify retained distribution hashes
        env:
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = Path("release-evidence/manifest.json")
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != os.environ["MANIFEST_SHA256"]:
              raise SystemExit("Release manifest hash mismatch")
          data = json.loads(manifest.read_text())
          version = os.environ["EXPECTED_VERSION"]
          expected = {f"iperf3_lib-{version}-py3-none-any.whl", f"iperf3_lib-{version}.tar.gz"}
          if (data["schema_version"] != 1 or data["version"] != version
                  or data["revision"] != os.environ["EXPECTED_REVISION"]
                  or set(data["files"]) != expected
                  or {p.name for p in Path("dist").iterdir()} != expected):
              raise SystemExit("Release bundle identity mismatch")
          for name in sorted(expected):
              path = Path("dist") / name
              actual = {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                        "size": path.stat().st_size}
              if actual != data["files"][name]:
                  raise SystemExit(f"Release artifact changed: {name}")
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: Create GitHub release from retained artifacts
    needs: [build, publish-pypi]
    if: ${{ needs.build.outputs.mode == 'pypi' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download retained release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-bundle
      - name: Verify retained distribution hashes
        env:
          EXPECTED_REVISION: ${{ needs.build.outputs.revision }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = Path("release-evidence/manifest.json")
          if hashlib.sha256(manifest.read_bytes()).hexdigest() != os.environ["MANIFEST_SHA256"]:
              raise SystemExit("Release manifest hash mismatch")
          data = json.loads(manifest.read_text())
          version = os.environ["EXPECTED_VERSION"]
          expected = {f"iperf3_lib-{version}-py3-none-any.whl", f"iperf3_lib-{version}.tar.gz"}
          if (data["schema_version"] != 1 or data["version"] != version
                  or data["revision"] != os.environ["EXPECTED_REVISION"]
                  or set(data["files"]) != expected
                  or {p.name for p in Path("dist").iterdir()} != expected):
              raise SystemExit("Release bundle identity mismatch")
          for name in sorted(expected):
              path = Path("dist") / name
              actual = {"sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                        "size": path.stat().st_size}
              if actual != data["files"][name]:
                  raise SystemExit(f"Release artifact changed: {name}")
          PY
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            release-evidence/manifest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
