name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    # Run the full compatibility matrix monthly as a maintenance reminder.
    - cron: "17 9 1 * *"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native-required: ${{ steps.scope.outputs.native-required }}
    steps:
      - name: Check out exact event revision and comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select required CI coverage
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          python scripts/ci_scope.py detect
          --event "$EVENT_NAME" --base "$BASE_SHA" --head "$HEAD_SHA"
          --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY"

  lint-and-types:
    name: lint-and-types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lifecycle-manifest-sha256: ${{ steps.lifecycle-build.outputs.manifest-sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv and Python
        id: setup-uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize frozen dependencies
        run: uv sync --frozen --dev

      - name: Run non-mutating checks
        run: make check

      - name: Run unit tests
        run: make test

      - name: Lint GitHub workflows with YAGA
        run: make workflow-lint

      - name: Check source and test changes
        if: github.event_name == 'pull_request'
        env:
          YAGA_RANGE: ${{ format('{0}...{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) }}
        run: >-
          uv run --frozen yaga change check
          --policy .yaga/change-policy.toml --range "$YAGA_RANGE" --format github

      - name: Build and identify lifecycle qualification distributions once
        id: lifecycle-build
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv build --no-sources --out-dir lifecycle-dist
          uv run --frozen python scripts/qualify_lifecycle.py manifest \
            --distributions lifecycle-dist --revision "$SOURCE_REVISION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain the exact lifecycle qualification distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-distributions
          path: lifecycle-dist/*
          if-no-files-found: error
          retention-days: 30

  commit-policy:
    name: YAGA commit policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check pull request title and commits
        uses: dariuszpanas/yaga/actions/commit-check@fe0a4b219002c7f49eee055f1fd7ef9c8ccd526f # v0.3.0

  docker-matrix-tests:
    name: docker (${{ matrix.python }}, iperf ${{ matrix.iperf }})
    runs-on: ubuntu-latest
    needs: [scope, lint-and-types]
    if: needs.scope.outputs.native-required == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
        iperf: ["3.19.1", "3.22"]
        include:
          # Official 3.15 images are not yet published. Select the final managed
          # interpreter explicitly instead of falling back to the base Python.
          - python: "3.15"
            python_base: python:3.14-slim
            python_version: "3.15.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download the retained wheel, sdist and source manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lifecycle-distributions
          path: lifecycle-dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build compatibility image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: iperf3-lib-test:py${{ matrix.python }}-iperf${{ matrix.iperf }}
          build-args: |
            PYTHON_BASE=${{ matrix.python_base || format('python:{0}-slim', matrix.python) }}
            PYTHON_RUNTIME=${{ matrix.python_version || 'python' }}
            IPERF3_VERSION=${{ matrix.iperf }}
          cache-from: type=gha,scope=py${{ matrix.python }}-iperf${{ matrix.iperf }}
          cache-to: type=gha,mode=max,scope=py${{ matrix.python }}-iperf${{ matrix.iperf }}

      - name: Verify final standard-GIL CPython runtime
        env:
          EXPECTED_PYTHON: ${{ matrix.python }}
        run: |
          docker run --rm -e EXPECTED_PYTHON \
            "iperf3-lib-test:py${{ matrix.python }}-iperf${{ matrix.iperf }}" \
            python -c 'import os, sys, sysconfig; assert sys.implementation.name == "cpython"; assert ".".join(map(str, sys.version_info[:2])) == os.environ["EXPECTED_PYTHON"]; assert sys.version_info.releaselevel == "final"; assert not sysconfig.get_config_var("Py_GIL_DISABLED"); print(sys.version)'

      - name: Run full test suite
        run: |
          docker run --rm -v "${{ github.workspace }}:/app" \
            "iperf3-lib-test:py${{ matrix.python }}-iperf${{ matrix.iperf }}" \
            bash -c "python --version && iperf3 --version && pytest -vv --cov=iperf3_lib --cov-report=term-missing"

      - name: Qualify installed wheel and sdist lifecycle outside the checkout
        env:
          SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          MANIFEST_SHA256: ${{ needs.lint-and-types.outputs.lifecycle-manifest-sha256 }}
          PYTHON_VERSION: ${{ matrix.python }}
          IPERF3_VERSION: ${{ matrix.iperf }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          mkdir -p lifecycle-evidence
          docker run --rm \
            --cap-add NET_ADMIN -e IPERF3_ADAPTIVE_IMPAIRMENT=1 \
            -v "${{ github.workspace }}/lifecycle-dist:/lifecycle-dist:ro" \
            -v "${{ github.workspace }}/lifecycle-evidence:/evidence" \
            "iperf3-lib-test:py${{ matrix.python }}-iperf${{ matrix.iperf }}" \
            python -I /app/scripts/qualify_lifecycle.py qualify \
            --source /app --distributions /lifecycle-dist \
            --revision "$SOURCE_REVISION" --manifest-sha256 "$MANIFEST_SHA256" \
            --python "$PYTHON_VERSION" --native "$IPERF3_VERSION" --output /evidence

      - name: Retain installed lifecycle receipts and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lifecycle-py${{ matrix.python }}-iperf${{ matrix.iperf }}
          path: lifecycle-evidence/*
          if-no-files-found: warn
          retention-days: 30

  ci:
    name: ci
    runs-on: ubuntu-latest
    needs: [scope, lint-and-types, commit-policy, docker-matrix-tests]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Check out exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify required jobs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_REQUIRED: ${{ needs.scope.outputs.native-required }}
          LINT_RESULT: ${{ needs.lint-and-types.result }}
          NATIVE_RESULT: ${{ needs.docker-matrix-tests.result }}
          COMMIT_RESULT: ${{ needs.commit-policy.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: python scripts/ci_scope.py gate
